name: video_subtitle_translator
description: "모바일에서 영상의 언어를 인식해 실시간 번역 자막을 표시하는 앱."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 비디오 재생
  video_player: ^2.9.2
  # 로컬 영상 파일 선택
  file_picker: ^8.1.4
  # 오디오 추출 (ffmpeg_kit_flutter는 폐기됨 -> 유지보수 포크 사용)
  # 1.x 의 android AAR 은 원본 바이너리 제거로 컴파일 실패 -> 4.x 사용
  ffmpeg_kit_flutter_new: ^4.2.1
  # HTTP (Google Cloud REST)
  http: ^1.2.2
  # 상태 관리
  flutter_riverpod: ^2.6.1
  # 환경변수 / 비밀 관리
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  # secure storage 불가 기기 대비 가장 호환성 높은 폴백 저장소(keystore 비의존)
  shared_preferences: ^2.3.2
  # 임시 디렉터리
  path_provider: ^2.1.5
  path: ^1.9.0
  # 유니코드 grapheme 단위 처리(문장부호 판정)
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
