name: video_subtitle_translator
description: "인프레임(In-Frame) — 영상 음성을 인식해 실시간 번역 자막을 표시하는 앱."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 비디오 재생
  video_player: ^2.9.2
  # 로컬 영상 파일 선택
  file_picker: ^8.1.4
  # 오디오 추출은 플랫폼 네이티브(Android MediaCodec / iOS AVAssetReader)로 처리한다.
  # FFmpegKit은 폐기됐고 16KB 페이지(Android 15/16) 비호환으로 제거함.
  # HTTP (Google Cloud REST)
  http: ^1.2.2
  # 상태 관리
  flutter_riverpod: ^2.6.1
  # 환경변수 / 비밀 관리
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  # secure storage 불가 기기 대비 가장 호환성 높은 폴백 저장소(keystore 비의존)
  shared_preferences: ^2.3.2
  # 임시 디렉터리
  path_provider: ^2.1.5
  path: ^1.9.0
  # 유니코드 grapheme 단위 처리(문장부호 판정)
  characters: ^1.3.0
  # 재생 제스처: 화면 밝기(앱 윈도우) / 시스템 볼륨 제어
  screen_brightness: ^1.0.1
  volume_controller: ^2.0.7
  # 재생 중 화면 꺼짐 방지(전체화면/긴 영상)
  wakelock_plus: ^1.2.5
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  # 런처 아이콘 생성(assets/icon 마스터 → 각 플랫폼 크기)
  flutter_launcher_icons: ^0.14.1

# 런처 아이콘 설정. 마스터는 tool/gen_icon.py로 생성. 생성 명령:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/in_frame.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/in_frame_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
