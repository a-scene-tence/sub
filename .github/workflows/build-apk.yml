name: Build Android APK

# 컴퓨터 없이(아이패드 등) 클라우드에서 APK를 빌드해 Release로 배포한다.
# 안드로이드 폰 브라우저에서 Release의 app-release.apk 를 받아 설치 후,
# 앱 설정 화면에서 Google API 키를 입력하면 된다(빌드에는 키가 필요 없음).

on:
  push:
    branches: ["claude/mobile-video-translation-j4jtfs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.1"

      - name: Create placeholder .env (asset 필요, 실제 키는 런타임 입력)
        run: echo "GOOGLE_API_KEY=" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (debug 서명 → 사이드로드 가능)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to a rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Android APK (latest)" \
            --notes "최신 빌드 APK. 안드로이드 폰 브라우저에서 app-release.apk 를 받아 설치하세요. 설치 후 앱 설정 화면에서 Google API 키를 입력하면 됩니다."
